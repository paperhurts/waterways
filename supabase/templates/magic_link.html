<!-- Supabase: Authentication > Emails > Magic link. Sent on every sign-in after the first.
     Subject: Your sign-in link for the spring journal -->
<div style="margin:0;padding:24px 16px;background:#e7e9e0;">
  <div style="max-width:480px;margin:0 auto;padding:28px 24px;background:#f6f7f2;border:1px solid #c3c7b8;border-radius:12px;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.5;color:#1f2419;">
    <p style="margin:0;font-size:14px;color:#5b6152;">Waterways</p>
    <h1 style="margin:2px 0 16px;font-family:Spectral,Georgia,'Times New Roman',serif;font-size:28px;font-weight:400;line-height:1.2;">Spring journal</h1>
    <p style="margin:0 0 20px;">Tap the button to sign in.</p>
    <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;border-radius:999px;background:#0a8f86;color:#ffffff;font-size:19px;font-weight:bold;text-decoration:none;">Sign in to the journal</a></p>
    <p style="margin:0 0 12px;font-size:15px;color:#5b6152;">Open it on the phone or computer you'll use the journal on. The link works once; if it's expired, ask for a new one on <a href="{{ .SiteURL }}" style="color:#0a8f86;">the journal page</a>.</p>
    <p style="margin:0;font-size:15px;color:#5b6152;">Didn't ask for this? You can ignore this email.</p>
  </div>
</div>
