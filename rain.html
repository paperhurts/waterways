  for(const [n,xy] of sinkLabels){const x=X(xy[0]),y=Y(xy[1]);if(x<0||y<0||x>W||y>H)continue;c.strokeStyle=FC[2];c.lineWidth=1.5;c.beginPath();c.arc(x,y,4.5,0,7);c.stroke();if(view.s>1600||bigSinks.has(n)){c.fillStyle=FC[2];c.fillText(n,x+7,y+4)}}
  // places
  c.fillStyle=C.muted;c.font="500 12px 'Barlow Semi Condensed',sans-serif";
  for(const [n,lon,lat] of [["Gainesville",-82.325,29.665],["High Springs",-82.585,29.815],["Alachua",-82.47,29.752],["Fort White",-82.713,29.905],["Lake City",-82.64,30.085],["Newberry",-82.61,29.646]]){const p=P(lon,lat);c.fillText(n,X(p[0]),Y(p[1]))}
  c.font="italic 14px 'Spectral',serif";const lab=(t,lon,lat,col)=>{const p=P(lon,lat);c.fillStyle=col;c.fillText(t,X(p[0]),Y(p[1]))};
  lab("Suwannee",-82.99,29.70,FC[0]);lab("Santa Fe",-82.47,29.93,FC[0]);lab("Paynes Prairie",-82.33,29.585,FC[2]);
}
const order=[...segs].sort((a,b)=>a.acc-b.acc);
// sinks that receive water (label points = terminal ends)
const sinkAgg=new Map();segs.forEach(s=>{if(s.f===2&&s.nxt<0){const e=s.pts[s.pts.length-1];const o=sinkAgg.get(s.sink)||{xy:e,acc:0};if(s.acc>o.acc){o.xy=e;o.acc=s.acc}sinkAgg.set(s.sink,o)}});
const sinkLabels=[...sinkAgg].map(([n,o])=>[n,o.xy]);const bigSinks=new Set([...sinkAgg].filter(([n,o])=>o.acc>15).map(([n])=>n));
// ----- particles: rain on every creek -----
const cumLen=[];let tl=0;for(const s of segs){tl+=s.len;cumLen.push(tl)}
function pickSeg(){const r=Math.random()*tl;let lo=0,hi=cumLen.length-1;while(lo<hi){const m=(lo+hi)>>1;if(cumLen[m]<r)lo=m+1;else hi=m}return lo}
const parts=[],flashes=[];let SPEED=0,RATE=160;const MAXP=18000;let acc=0;
function step(dt){acc+=RATE*dt;while(acc>=1){acc--;if(parts.length<MAXP){const i=pickSeg();parts.push({s:i,d:Math.random()*segs[i].len,f:segs[i].f,o:Math.random()-.5})}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.d+=SPEED*dt;let s=segs[p.s];let hops=0;
    while(p.d>s.len&&hops<6){hops++;if(s.nxt>=0){p.d-=s.len;p.s=s.nxt;s=segs[p.s]}else{if(s.f===2||s.f===3){const e=s.pts[s.pts.length-1];if(Math.random()<.15)flashes.push({xy:e,t:0,f:s.f})}parts.splice(i,1);break}}}
  for(let i=flashes.length-1;i>=0;i--){flashes[i].t+=dt;if(flashes[i].t>1.2)flashes.splice(i,1)}}
function draw(){const c=fctx;c.setTransform(DPR,0,0,DPR,0,0);c.globalCompositeOperation="destination-out";c.fillStyle="rgba(0,0,0,.18)";c.fillRect(0,0,W,H);c.globalCompositeOperation="source-over";
  const z=Math.min(2.4,Math.max(1.1,view.s/1100));
  for(const p of parts){const s=segs[p.s];const a=at(s,p.d);const x=X(a[0]),y=Y(a[1]);if(x<-4||y<-4||x>W+4||y>H+4)continue;c.fillStyle=FC[p.f];c.globalAlpha=s.ug?.5:.95;c.fillRect(x-z/2,y-z/2,z,z)}
  c.globalAlpha=1;
  for(const f of flashes){const x=X(f.xy[0]),y=Y(f.xy[1]);c.strokeStyle=FC[f.f];c.globalAlpha=Math.max(0,1-f.t/1.2)*.8;c.lineWidth=1.2;c.beginPath();c.arc(x,y,2+f.t*9,0,7);c.stroke()}
  const now=performance.now()/1000;c.fillStyle=C.spring;
  for(const s of springs){const x=X(s.xy[0]),y=Y(s.xy[1]);if(x<0||y<0||x>W||y>H)continue;c.globalAlpha=.25;c.beginPath();c.arc(x,y,3.2+Math.sin(now*2+x)*.6,0,7);c.fill();c.globalAlpha=.95;c.beginPath();c.arc(x,y,1.5,0,7);c.fill()}
  c.globalAlpha=1}
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(target){const k=Math.min(1,(t-target.t0)/900),e=k<.5?2*k*k:1-(-2*k+2)**2/2;for(const q of["s","tx","ty"])view[q]=target.from[q]+(target.to[q]-target.from[q])*e;drawBase();clearFx();if(k>=1)target=null}
  if(!paused){step(dt);draw()}requestAnimationFrame(frame)}
// ----- interaction -----
const ptrs=new Map();let drag=null,moved=0;const clampS=s=>Math.max(250,Math.min(60000,s));
stage.addEventListener("pointerdown",e=>{if(e.target.closest("button,#card"))return;stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);moved=0;target=null;
  if(ptrs.size===1)drag={x:e.offsetX,y:e.offsetY,tx:view.tx,ty:view.ty};
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];drag={pinch:Math.hypot(a[0]-b[0],a[1]-b[1]),s:view.s,cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2,tx:view.tx,ty:view.ty}}});
stage.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);if(!drag)return;
  if(ptrs.size===1&&!drag.pinch){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));view.tx=drag.tx+dx;view.ty=drag.ty+dy}
  else if(ptrs.size===2&&drag.pinch){const[a,b]=[...ptrs.values()];const s=clampS(drag.s*Math.hypot(a[0]-b[0],a[1]-b[1])/drag.pinch),k=s/drag.s;view.s=s;view.tx=drag.cx-(drag.cx-drag.tx)*k;view.ty=drag.cy-(drag.cy-drag.ty)*k;moved=99}
  drawBase();clearFx()});
const end=e=>{const n=ptrs.size;ptrs.delete(e.pointerId);if(n===1&&moved<6)tap(e.offsetX,e.offsetY);if(!ptrs.size)drag=null;else{const[p]=[...ptrs.values()];drag={x:p[0],y:p[1],tx:view.tx,ty:view.ty}}};
stage.addEventListener("pointerup",end);stage.addEventListener("pointercancel",end);
stage.addEventListener("wheel",e=>{e.preventDefault();target=null;const s=clampS(view.s*Math.exp(-e.deltaY*.0015)),k=s/view.s;view.tx=e.offsetX-(e.offsetX-view.tx)*k;view.ty=e.offsetY-(e.offsetY-view.ty)*k;view.s=s;drawBase();clearFx()},{passive:false});
const card=document.getElementById("card"),cardBody=document.getElementById("cardBody");
document.getElementById("cardX").onclick=()=>{card.classList.remove("on");sel=null;drawBase()};
function distSeg(px,py,a,b){const ax=X(a[0]),ay=Y(a[1]),bx=X(b[0]),by=Y(b[1]);const dx=bx-ax,dy=by-ay,dd=dx*dx+dy*dy;const t=dd?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/dd)):0;return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function tap(x,y){let best=-1,bd=14;
  // spring hit first
  for(const s of springs){if(Math.hypot(X(s.xy[0])-x,Y(s.xy[1])-y)<10){sel=null;drawBase();showCard(s.n,"Spring","Groundwater rising back to the surface. Water that drops into sinks upstream can come out at springs like this one, sometimes days later.",C.spring);return}}
  segs.forEach((s,i)=>{for(let k=1;k<s.pts.length;k++){const d=distSeg(x,y,s.pts[k-1],s.pts[k]);if(d<bd){bd=d;best=i}}});
  if(best<0){card.classList.remove("on");sel=null;drawBase();return}
  const path=[];let i=best,km=0,guard=0,named=null;while(i>=0&&guard++<5000){const s=segs[i];path.push(s);km+=s.len*111;if(!named&&s.name&&i!==best)named=s.name;i=s.nxt}
  const s0=segs[best],last=path[path.length-1];sel={path,end:last.pts[last.pts.length-1]};drawBase();
  const mi=km*0.621;const F=FATES[s0.f];
  let body=F.via;if(s0.f===2&&s0.sink)body=`Ends at <b>${s0.sink}</b> and goes straight into the Floridan aquifer.`;
  const dist=s0.f<=1?`Its water travels at least ${Math.round(mi)} miles before leaving this map.`:`Its water travels about ${mi<1?mi.toFixed(1):Math.round(mi)} miles along the surface before it disappears.`;
  showCard(s0.name||"Unnamed creek",F.label,`${body} ${dist}${named&&named!==s0.name?` Along the way it joins ${named}.`:""}`,FC[s0.f])}
function showCard(t,k,b,col){cardBody.innerHTML=`<h2>${t}</h2><div class="kind" style="color:${col}">${k}</div><p>${b}</p>`;card.classList.add("on");document.getElementById("hint").style.display="none"}
document.getElementById("vAll").onclick=()=>fit(VIEWS.all,1);document.getElementById("vGnv").onclick=()=>fit(VIEWS.gnv,1);document.getElementById("vAla").onclick=()=>fit(VIEWS.ala,1);document.getElementById("vSpr").onclick=()=>fit(VIEWS.spr,1);
const bp=document.getElementById("bPause");bp.onclick=()=>{paused=!paused;bp.textContent=paused?"Play":"Pause";bp.setAttribute("aria-pressed",paused)};
if(document.getElementById("flowLink").getAttribute("href").startsWith("__"))document.getElementById("flowLink").remove();
// ----- boot -----
function boot(){readColors();resize();fit(VIEWS.all,0);SPEED=(VIEWS.all[2]-VIEWS.all[0])/40;
  for(let t=0;t<45;t+=.25)step(.25);
  if(reduce){draw();paused=true;bp.textContent="Play"}
  requestAnimationFrame(t=>{last=t;frame(t)})}
addEventListener("resize",()=>{resize();fit(VIEWS.all,0)});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{readColors();drawBase();clearFx()});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(boot);
</script>
