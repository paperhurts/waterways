<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where does the rain go?</title>
<meta name="description" content="Every mapped creek from the Suwannee to Rainbow River and the Ocklawaha, up the St. Johns to its headwaters, and down the Treasure Coast to the St. Lucie and the Loxahatchee, colored by where its water ends up, followed down the rivers to the sea.">
<meta property="og:type" content="website">
<meta property="og:title" content="Where does the rain go?">
<meta property="og:description" content="Every mapped creek from the Suwannee to Rainbow River and the Ocklawaha, up the St. Johns to its headwaters, and down the Treasure Coast to the St. Lucie and the Loxahatchee, colored by where its water ends up, followed down the rivers to the sea.">
<meta property="og:url" content="https://waterways.paperhurts.dev/rain.html">
<meta property="og:image" content="https://waterways.paperhurts.dev/github-social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module" src="/src/rain/main.ts"></script>
</head>
<body>
<div id="wrap">
<header>
  <!-- site-nav -->
  <h1>Where does the rain go?</h1>
  <p class="lede" id="lede">Loading creeks…</p>
</header>
<div id="legend"></div>
<div id="stage" role="img" aria-label="Animated map of every mapped creek from the Suwannee River to Rainbow River and the Ocklawaha, up the St. Johns River to its headwaters, and down the Treasure Coast through the St. Lucie to the Loxahatchee, colored by where its water ends up and followed down the rivers to the sea">
  <canvas id="base"></canvas><canvas id="fx"></canvas>
  <div id="hint">Tap any creek to follow its water</div>
  <div id="card" role="dialog" aria-live="polite"><button type="button" id="cardX" aria-label="Close">×</button><div id="cardBody"></div></div>
</div>
<div class="tools">
  <button type="button" id="vAll">Whole map</button>
  <select id="view" aria-label="Zoom to part of the map">
    <option value="">Zoom to…</option>
    <option value="gnv">Gainesville</option>
    <option value="ala">Alachua &amp; Mill Creek</option>
    <option value="spr">Santa Fe spring run</option>
    <option value="msw">Middle Suwannee springs</option>
    <option value="gulf">Lower Suwannee &amp; Manatee</option>
    <option value="rbw">Rainbow &amp; Crystal River</option>
    <option value="stj">Silver Springs &amp; Lake George</option>
    <option value="ock">Ocklawaha &amp; Harris Chain</option>
    <option value="atl">St. Johns to the Atlantic</option>
    <option value="mid">Blue Spring, Wekiva &amp; Lake Monroe</option>
    <option value="upr">Upper St. Johns &amp; the lagoon</option>
    <option value="stl">St. Lucie &amp; the Treasure Coast</option>
  </select>
  <button type="button" id="bPause" aria-pressed="false">Pause</button>
</div>
<div id="status">Streams: USGS National Hydrography Dataset (high resolution). Sinks: NHD sink points and FGS swallet survey. Springs: FDEP and NHD. Each dot is rain landing on a creek; its color is where that creek's water ends up.</div>
</div>
</body>
</html>
